version: '3.8'

services:
  backend:
    build:
      context: ./backend
      target: development
    container_name: divvyup-backend-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:/app/data/dev.db
      - JWT_SECRET=dev_secret_change_me
      - PORT=4000
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_data_dev:/app/data
    ports:
      - "4000:4000"
    command: npm run dev
    networks:
      - divvyup_network

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: divvyup-frontend-dev
    restart: unless-stopped
    environment:
      - VITE_API_BASE=http://localhost:4000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    networks:
      - divvyup_network

volumes:
  backend_node_modules:
  frontend_node_modules:
  backend_data_dev:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data-dev

networks:
  divvyup_network:
    driver: bridge
