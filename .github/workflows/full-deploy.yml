name: Deploy Full Application

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Backend Testing and Deployment
  backend-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
      
      - name: Install backend dependencies
        run: |
          cd backend
          npm ci
      
      - name: Generate Prisma client
        run: |
          cd backend
          npm run prisma:generate
      
      - name: Run backend tests
        run: |
          cd backend
          npm run test:ci
        env:
          NODE_ENV: test
          DATABASE_URL: "file:./test.db"
          JWT_SECRET: "test_secret"
      
      - name: Build backend
        run: |
          cd backend
          npm run build

  backend-deploy:
    needs: backend-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true

  # Frontend Testing and Deployment
  frontend-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Check frontend types
        run: |
          cd frontend
          npm run check
      
      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}

  frontend-deploy:
    needs: [frontend-test, backend-deploy]
    runs-on: ubuntu-latest
    if: always() && (needs.backend-deploy.result == 'success' || github.event_name == 'pull_request')
    
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      
      - name: Deploy to Vercel (Preview)
        if: github.event_name == 'pull_request'
        run: |
          echo "VERCEL_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> $GITHUB_ENV
      
      - name: Deploy to Vercel (Production)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          echo "VERCEL_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})" >> $GITHUB_ENV

  # Health Check and Notification
  health-check:
    needs: [backend-deploy, frontend-deploy]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Wait for services to be ready
        run: sleep 30
      
      - name: Health check backend
        run: |
          echo "🔍 Checking backend health..."
          for i in {1..5}; do
            if curl -f ${{ secrets.RENDER_SERVICE_URL }}/health; then
              echo "✅ Backend is healthy!"
              break
            fi
            echo "Attempt $i failed, retrying in 10 seconds..."
            sleep 10
          done
      
      - name: Health check frontend
        run: |
          echo "🔍 Checking frontend deployment..."
          if curl -f ${{ secrets.VERCEL_PROJECT_URL }}; then
            echo "✅ Frontend is accessible!"
          else
            echo "⚠️ Frontend check failed"
          fi
      
      - name: Create deployment summary
        uses: actions/github-script@v7
        with:
          script: |
            const backendStatus = '${{ needs.backend-deploy.result }}';
            const frontendStatus = '${{ needs.frontend-deploy.result }}';
            
            let summary = '# 🚀 Deployment Summary\n\n';
            summary += `**Backend**: ${backendStatus === 'success' ? '✅ Deployed' : '❌ Failed'}\n`;
            summary += `**Frontend**: ${frontendStatus === 'success' ? '✅ Deployed' : '❌ Failed'}\n\n`;
            
            if (backendStatus === 'success') {
              summary += `🌐 **Backend URL**: ${{ secrets.RENDER_SERVICE_URL }}\n`;
            }
            if (frontendStatus === 'success') {
              summary += `🌐 **Frontend URL**: ${{ secrets.VERCEL_PROJECT_URL }}\n`;
            }
            
            summary += `\n**Commit**: ${context.sha.substring(0, 7)}\n`;
            summary += `**Branch**: ${context.ref.replace('refs/heads/', '')}\n`;
            
            await core.summary.addRaw(summary).write();
            console.log(summary);
