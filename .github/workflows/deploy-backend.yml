name: Deploy Backend to Render

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'render.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
      
      - name: Install backend dependencies
        run: |
          cd backend
          npm ci
      
      - name: Generate Prisma client
        run: |
          cd backend
          npm run prisma:generate
      
      - name: Run backend tests
        run: |
          cd backend
          npm run test:ci
        env:
          NODE_ENV: test
          DATABASE_URL: "file:./test.db"
          JWT_SECRET: "test_secret"
      
      - name: Build backend
        run: |
          cd backend
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true
      
      - name: Health check
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 30
          
          # Try health check with retries
          for i in {1..10}; do
            if curl -f ${{ secrets.RENDER_SERVICE_URL }}/health; then
              echo "✅ Backend deployment successful!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10 seconds..."
            sleep 10
          done
          
          echo "❌ Health check failed after 10 attempts"
          exit 1

  notify:
    needs: [test, deploy]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Notify deployment status
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentStatus = '${{ needs.deploy.result }}';
            const testStatus = '${{ needs.test.result }}';
            
            let message = '🔧 Backend Deployment Status:\n';
            message += `- Tests: ${testStatus === 'success' ? '✅ Passed' : '❌ Failed'}\n`;
            message += `- Deployment: ${deploymentStatus === 'success' ? '✅ Successful' : '❌ Failed'}\n`;
            
            if (deploymentStatus === 'success') {
              message += `\n🌐 Backend URL: ${{ secrets.RENDER_SERVICE_URL }}`;
            }
            
            console.log(message);
