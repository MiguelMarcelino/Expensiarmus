services:
  - type: web
    name: expensiarmus-backend
    env: node
    buildCommand: cd backend && npm ci && npm run build:production
    startCommand: cd backend && npm run prisma:migrate:production && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: expensiarmus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://expensiarmus.vercel.app

databases:
  - name: expensiarmus-db
    databaseName: expensiarmus
    user: expensiarmus
