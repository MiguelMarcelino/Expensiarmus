version: '3.8'

services:
  backend:
    build:
      context: ./backend
      target: production
    container_name: expensiarmus-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/production.db
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_change_in_production}
      - PORT=4000
    volumes:
      - backend_data:/app/data
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "http.get('http://localhost:4000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - expensiarmus_network

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: expensiarmus-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - expensiarmus_network

volumes:
  backend_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data

networks:
  expensiarmus_network:
    driver: bridge
